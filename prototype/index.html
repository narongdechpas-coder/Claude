<title>เคลมค่าขาดประโยชน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: claimant view is a single mobile-first column (max 560px); back office is queue + detail split. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EEEC; --line:#D3DDDA;
  --ink:#16262A; --muted:#566A6E; --accent:#0B6B60; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --sign:#F2B233; --sign-soft:#FDF1D6; --sign-ink:#5A3D00;
  --ok:#1E7B45; --ok-soft:#DDF2E4; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B3261E; --bad-soft:#F9E0DE; --info:#2456A6; --info-soft:#E0E9F8;
  --plate-bg:#FFFFFF; --plate-ink:#111111;
  --s1:#2a78d6; --s2:#eb6834; --o1:#86b6ef; --o2:#2a78d6; --o3:#104281; --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b;
  --shadow:0 1px 2px rgba(22,38,42,.06),0 4px 16px rgba(22,38,42,.06);
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#172427; --sunk:#1E2E31; --line:#2C3F43;
  --ink:#E6EEEC; --muted:#9AB0AE; --accent:#3CC2AE; --accent-ink:#06201C; --accent-soft:#16383A;
  --sign:#F2B233; --sign-soft:#3A2E12; --sign-ink:#F7D489;
  --ok:#5BD08A; --ok-soft:#173826; --warn:#F0B354; --warn-soft:#3A2C12; --bad:#F2867E; --bad-soft:#3E1D1B; --info:#86AEF0; --info-soft:#1B2A45;
  --plate-bg:#F4F4F0; --plate-ink:#111111;
  --s1:#3987e5; --s2:#d95926; --o1:#184f95; --o2:#3987e5; --o3:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#172427; --sunk:#1E2E31; --line:#2C3F43;
  --ink:#E6EEEC; --muted:#9AB0AE; --accent:#3CC2AE; --accent-ink:#06201C; --accent-soft:#16383A;
  --sign:#F2B233; --sign-soft:#3A2E12; --sign-ink:#F7D489;
  --ok:#5BD08A; --ok-soft:#173826; --warn:#F0B354; --warn-soft:#3A2C12; --bad:#F2867E; --bad-soft:#3E1D1B; --info:#86AEF0; --info-soft:#1B2A45;
  --plate-bg:#F4F4F0; --plate-ink:#111111;
  --s1:#3987e5; --s2:#d95926; --o1:#184f95; --o2:#3987e5; --o3:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.88rem;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.82rem;text-decoration:underline;padding:4px}
.sim{background:var(--sign-soft);color:var(--sign-ink);font-size:.8rem;text-align:center;padding:5px 16px}

/* containers */
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
.wrap-wide{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.flat{background:var(--sunk);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}

/* buttons */
.btn{border:1px solid transparent;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600;font-size:.98rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.86rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chipbtn{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-height:48px;font-size:1rem}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.otp{letter-spacing:.5em;font-family:var(--f-mono);text-align:center;font-size:1.3rem}

/* alerts */
.alert{border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.alert b{font-weight:600}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert .ico{flex:none;font-weight:700}

/* hero */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lede{font-size:1.05rem;color:var(--muted)}

/* estimate (road-sign style) */
.est{background:var(--sign-soft);border:2px solid var(--sign);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.est .amt{font-family:var(--f-display);font-weight:700;font-size:2rem;color:var(--sign-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.est .formula{font-size:.88rem;color:var(--sign-ink)}

/* Thai licence plate */
.plate{display:inline-flex;flex-direction:column;align-items:center;background:var(--plate-bg);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:7px;padding:4px 14px 3px;line-height:1.15;min-width:128px;box-shadow:inset 0 0 0 2px var(--plate-bg),inset 0 0 0 3px var(--plate-ink)}
.plate .p1{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.02em}
.plate .p2{font-size:.68rem}
.plate.sm{min-width:96px;padding:2px 8px 1px}
.plate.sm .p1{font-size:.95rem}
.plate.sm .p2{font-size:.58rem}

/* wizard stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stepper div{display:flex;flex-direction:column;gap:6px;font-size:.72rem;color:var(--muted);text-align:center}
.stepper div::before{content:"";height:5px;border-radius:5px;background:var(--line)}
.stepper .done::before,.stepper .now::before{background:var(--accent)}
.stepper .now{color:var(--ink);font-weight:600}

/* key-value list */
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:6px 14px;font-size:.93rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}

/* docs */
.doc{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.doc .dico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted);font-weight:700}
.doc.has .dico{background:var(--ok-soft);color:var(--ok)}
.doc .dtxt{flex:1;min-width:160px}
.doc .dname{font-weight:600;font-size:.93rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.sign{background:var(--sign-soft);color:var(--sign-ink)}

/* progress (claimant tracker) */
.prog{display:flex;flex-direction:column;gap:0;padding:0;margin:0}
.prog li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.prog li:last-child{padding-bottom:0}
.prog li::after{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.prog li:last-child::after{display:none}
.prog .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted);z-index:1}
.prog .done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prog .done::after{background:var(--accent)}
.prog .now .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.prog .t{font-weight:600}
.prog .todo .t{color:var(--muted);font-weight:500}

/* timeline */
.tl{padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.tl li{list-style:none;display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.88rem}
.tl .when{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .by{font-size:.74rem;color:var(--muted)}

/* back office */
.bo{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.bo{grid-template-columns:1fr}}
.bo > *{min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q{display:flex;flex-direction:column;gap:8px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;width:100%}
.qi:hover{border-color:var(--accent)}
.qi[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qi .qn{font-weight:600;font-size:.92rem}
.qi .qm{grid-column:2 / 4;font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chain{display:flex;gap:8px;flex-wrap:wrap}
.chain .lv{flex:1;min-width:140px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.84rem;display:flex;flex-direction:column;gap:2px}
.chain .lv.ok{border-color:var(--ok);background:var(--ok-soft)}
.chain .lv.next{border-color:var(--sign);background:var(--sign-soft)}
.chain .lv.skip{opacity:.45;border-style:dashed}
.chain .lvh{font-weight:700;font-family:var(--f-display)}
.console{background:#0E1719;color:#CFE3DE;border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:.78rem;overflow-x:auto;white-space:pre;line-height:1.5}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:500;font-size:.8rem}
.tbl td.r,.tbl th.r{text-align:right}
details summary{cursor:pointer;font-weight:600}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow-y:auto}
@media (min-width:640px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 8px);overflow-y:auto}
.consent{background:var(--sunk);border-radius:12px;padding:14px;font-size:.9rem;display:flex;flex-direction:column;gap:8px}
mark{background:var(--sign-soft);color:var(--sign-ink);padding:1px 3px;border-radius:4px;font-weight:600}

/* paper document */
.paper{background:#FFFFFF;color:#1A1A1A;border-radius:6px;padding:26px 24px;font-size:.88rem;display:flex;flex-direction:column;gap:12px;border:1px solid #DDD}
.paper .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #1A1A1A;padding-bottom:10px}
.paper h3{font-size:1.1rem;text-align:center}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:5px 0;border-bottom:1px dotted #BBB;vertical-align:top}
.paper td:first-child{color:#555;width:42%}
.paper .stamp{align-self:flex-end;border:2px solid #0B6B60;color:#0B6B60;border-radius:8px;padding:6px 12px;font-weight:700;transform:rotate(-4deg);font-family:var(--f-display)}

.big-ok{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:2rem;font-weight:700}
.caseno{font-family:var(--f-mono);font-size:1.4rem;font-weight:500;letter-spacing:.04em}
.howlist{margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:h}
.howlist li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:h}
.howlist li::before{content:counter(h);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.needs div{background:var(--sunk);border-radius:12px;padding:12px;font-size:.88rem}
.needs b{display:block;font-size:.92rem}
@media (max-width:440px){.needs{grid-template-columns:1fr}}
/* report */
.rtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rgrid > *{min-width:0}
.span2{grid-column:1 / -1}
@media (max-width:860px){.rgrid{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:.78rem;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.hb{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.86rem;padding-block:5px}
.track{display:flex;gap:2px;height:18px;min-width:0}
.sgm{height:100%;min-width:3px;cursor:default}
.track .sgm:last-child{border-radius:0 4px 4px 0}
.hb .n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;min-width:2.5em;text-align:right}
.vb{position:relative;height:190px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;padding-left:44px;border-bottom:1px solid var(--line)}
.vb .gl{position:absolute;left:44px;right:0;border-top:1px dashed var(--line)}
.vb .gl span{position:absolute;left:-44px;top:-.6em;width:40px;text-align:right;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.vb .col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;z-index:1}
.vb .bar{width:56%;max-width:64px;background:var(--s1);border-radius:4px 4px 0 0;min-height:2px}
.vb .val{font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.vx{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-left:44px;font-size:.78rem;color:var(--muted);text-align:center;margin-top:6px}
.rti{position:relative;width:100px;height:10px;background:var(--sunk);border-radius:5px;flex:none}
.rti b{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.rti i{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.sdot{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.sdot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.alist{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.arow .ai{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;background:var(--c)}
.arow .ac{font-family:var(--f-display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.idchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 8px;font-family:var(--f-mono);font-size:.72rem;cursor:pointer;color:var(--ink)}
.idchip:hover{border-color:var(--accent)}
.cmp td.best{font-weight:700}
.insight{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}
.tblwrap{overflow-x:auto}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 10px;border-radius:8px;max-width:260px;box-shadow:var(--shadow)}
/* flow diagram */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:980px){.flow{grid-template-columns:1fr}}
.flow > *{min-width:0}
.flow-svg{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.flow-svg svg{display:block;width:100%;min-width:640px;height:auto}
.flow-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:980px){.flow-side{position:static}}

function addBizDays(iso, n) { const d = new Date(iso); let k = 0; while (k < n) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) k++; } return d.toISOString(); }
// ตอนที่เป็นตาบริษัท: บอกลูกค้าว่าไม่ต้องทำอะไร รอถึงเมื่อไหร่ และขั้นต่อไปคืออะไร
function nextCard(c) {
  const left = c.status === 'PENDING_APPROVAL' ? requiredStep(c.approvedAmount) - c.approvals.length : 1;
  const T = {
    SUBMITTED:        { now:'เจ้าหน้าที่กำลังตรวจเอกสารของคุณ', days:SLA.SUBMITTED + SLA.UNDER_REVIEW, until:'แจ้งผลพิจารณายอดเงิน', next:'เมื่อเอกสารครบ บริษัทจะคำนวณยอดตามจำนวนวันซ่อมและอนุมัติวงเงิน แล้วส่ง SMS ให้คุณเข้ามาตรวจยอดและตอบรับ', ifBad:'ถ้าเอกสารไม่ครบ เราจะส่ง SMS บอกว่าต้องส่งอะไรเพิ่ม' },
    UNDER_REVIEW:     { now:'เอกสารครบแล้ว บริษัทกำลังคำนวณยอดเงิน', days:SLA.UNDER_REVIEW, until:'แจ้งผลพิจารณายอดเงิน', next:'คุณจะได้รับ SMS ให้เข้ามาดูยอดเงินและวิธีคิด แล้วกดตอบรับด้วยรหัส OTP' },
    PENDING_APPROVAL: { now:`ยอดเงินอยู่ระหว่างอนุมัติ (เหลืออีก ${left} ขั้น)`, days:SLA.PENDING_APPROVAL * left, until:'แจ้งผลพิจารณายอดเงิน', next:'คุณจะได้รับ SMS ให้เข้ามาดูยอดเงินและวิธีคิด แล้วกดตอบรับด้วยรหัส OTP' },
    ACCEPTED:         { now:`คุณตอบรับยอด ${baht(c.approvedAmount)} แล้ว ฝ่ายการเงินกำลังโอนเงิน`, days:SLA.ACCEPTED, until:'เงินเข้าบัญชี ' + esc(c.bank.name) + ' ' + maskAcct(c.bank.acct), next:'เมื่อเงินเข้าแล้ว ดาวน์โหลดหนังสือยืนยันการจ่ายเงินได้ที่หน้านี้' },
  }[c.status];
  if (!T) return '';
  const due = addBizDays(c.statusAt || c.history[c.history.length - 1].at, T.days);
  return `<section class="card" style="order:2">
    <span class="turn co">รอบริษัทดำเนินการ</span>
    <h3>ตอนนี้คุณไม่ต้องทำอะไร</h3>

function offerBreakdown(c) {
  const r = RATES[c.type].rate, rd = reqDays(c);
  return `<dl class="kv">
    <dt>วันที่ขอ</dt><dd class="num">${rd} วัน (${fmtD(c.repairIn)} – ${fmtD(c.repairOut)})</dd>
    <dt>วันที่อนุมัติ</dt><dd class="num">${c.approvedDays} วัน</dd>
    <dt>อัตราต่อวัน</dt><dd class="num">${r.toLocaleString('th-TH')} บาท</dd>
  </dl>
  <div class="est"><span class="small" style="color:var(--sign-ink)">ยอดอนุมัติ</span><span class="amt">${baht(c.approvedAmount)}</span><span class="formula">${c.approvedDays} วัน × ${r.toLocaleString('th-TH')} บาท</span></div>
  ${c.adjustReason ? `<div class="alert info"><span class="ico">i</span><span><b>เหตุผลที่ยอดต่างจากที่ขอ:</b> ${esc(c.adjustReason)}</span></div>` : ''}`;
}

function claimantAction(c) {
  const t = UI.t;
  if (c.status === 'WAITING_REPAIR') {
    return `<section class="card"><h3>ส่งวันที่รับรถคืน</h3>
      ${UI.err ? `<div class="alert bad"><span class="ico">!</span><span>${UI.err}</span></div>` : ''}
      ${c.expectedOut ? `<p class="small muted">อู่นัดรับรถวันที่ ${fmtD(c.expectedOut)}</p>` : ''}
      <div class="field"><label for="c-out">วันที่รับรถคืนจริง</label><input class="input" type="date" id="c-out" data-t="out" value="${esc(t.out || '')}" min="${c.repairIn}" max="${todayISO()}"><span class="hint">กรอกหลังรับรถแล้ว จึงเลือกได้ถึงวันนี้</span></div>
      ${docRow(DOCS[4], t.doc_repairOut, 'data-cdoc')}
      <button class="btn primary" data-a="sendRepairOut">ส่งข้อมูล</button></section>`;
  }
  if (c.status === 'NEED_INFO') {
    const need = c.needInfo?.docs || [];
    return `<section class="card"><h3>เอกสารที่ต้องส่งเพิ่ม</h3>
      ${c.needInfo?.note ? `<div class="alert warn"><span class="ico">!</span><span><b>ข้อความจากเจ้าหน้าที่:</b> ${esc(c.needInfo.note)}</span></div>` : ''}
      ${UI.err ? `<div class="alert bad"><span class="ico">!</span><span>${UI.err}</span></div>` : ''}
      <div class="stack">${need.map(id => docRow(DOCS.find(d => d.id === id), t['doc_' + id], 'data-cdoc')).join('')}</div>
      <button class="btn primary" data-a="sendMore">ส่งเอกสารเพิ่ม</button></section>`;
  }
  if (c.status === 'OFFERED') {
    return `<section class="card"><h3>ผลพิจารณาวงเงิน</h3>${offerBreakdown(c)}
      <button class="btn primary block" data-a="openSign">ตอบรับและลงนามด้วย OTP</button>
      ${c.appealCount < 1 ? `<button class="btn ghost block" data-a="openAppeal">ไม่เห็นด้วย ขอทบทวน</button>` : `<p class="small muted">คุณใช้สิทธิ์ขอทบทวนแล้ว หากยังไม่เห็นด้วย ติดต่อ คปภ. สายด่วน 1186</p>`}</section>`;
  }
  if (c.status === 'ACCEPTED') {
    return `<section class="card"><h3>รอโอนเงิน</h3><dl class="kv"><dt>ยอดเงิน</dt><dd class="num">${baht(c.approvedAmount)}</dd><dt>เข้าบัญชี</dt><dd>${esc(c.bank.name)} ${maskAcct(c.bank.acct)}</dd><dt>ลงนามเมื่อ</dt><dd>${fmtDT(c.signedAt)}</dd></dl>
      <p class="small muted">ปกติเงินเข้าภายใน 3 วันทำการหลังตอบรับ</p></section>`;
  }
  if (c.status === 'PAYMENT_FAILED') {
    return `<section class="card"><h3>แก้ไขบัญชีรับเงิน</h3>
      <div class="alert bad"><span class="ico">!</span><span>${esc(c.payment?.error || 'ธนาคารปฏิเสธการโอน')}</span></div>
      ${UI.err ? `<div class="alert bad"><span class="ico">!</span><span>${UI.err}</span></div>` : ''}
      <div class="grid2">
        <div class="field"><label for="c-bank">ธนาคาร</label><select class="input" id="c-bank" data-t="bank">${BANKS.map(b => `<option ${b === (t.bank || c.bank.name) ? 'selected' : ''}>${b}</option>`).join('')}</select></div>
        <div class="field"><label for="c-acct">เลขที่บัญชี</label><input class="input num" id="c-acct" data-t="acct" value="${esc(t.acct ?? '')}" inputmode="numeric" maxlength="12" placeholder="ตัวเลข 10–12 หลัก"></div>
      </div>
      <dl class="kv"><dt>ชื่อบัญชี</dt><dd>${esc(c.holder)}</dd></dl>
      <button class="btn primary" data-a="fixBank">บันทึกบัญชีใหม่</button></section>`;
  }
  if (c.status === 'PAID') {
    return `<section class="card"><h3>ได้รับเงินแล้ว</h3>
      <dl class="kv"><dt>ยอดเงิน</dt><dd class="num">${baht(c.approvedAmount)}</dd><dt>เข้าบัญชี</dt><dd>${esc(c.bank.name)} ${maskAcct(c.bank.acct)}</dd><dt>วันที่โอน</dt><dd>${fmtDT(c.payment.at)}</dd><dt>เลขอ้างอิง</dt><dd class="mono">${esc(c.payment.ref)}</dd></dl>
      <div class="stack"><button class="btn primary" data-a="docLetter" data-id="${c.id}">ดูหนังสือยืนยันการจ่ายเงิน</button>
      <button class="btn ghost" data-a="docConsent" data-id="${c.id}">ดูสำเนาหนังสือยินยอมที่ลงนาม</button></div></section>`;
  }
  return '';
}

const FILTERS = [
  ['todo', 'งานที่ต้องทำ', ['SUBMITTED', 'UNDER_REVIEW', 'PENDING_APPROVAL', 'ACCEPTED']],
  ['wait', 'รอผู้เรียกร้อง', ['WAITING_REPAIR', 'NEED_INFO', 'OFFERED', 'PAYMENT_FAILED']],
  ['paid', 'จ่ายแล้ว', ['PAID']],
  ['all', 'ทั้งหมด', Object.keys(ST)],
];

  const f = FILTERS.find(x => x[0] === UI.boFilter);

  if (UI.boTab === 'report') return `<main class="wrap-wide">${tabs}${renderReport()}</main>`;
  if (UI.boTab === 'flow') return `<main class="wrap-wide">${tabs}${renderFlow()}</main>`;
  return `<main class="wrap-wide">${tabs}
    <div class="row between" style="margin-bottom:14px">
      <div><h2>คำร้องค่าขาดประโยชน์</h2><p class="small muted">${S.cases.length} คำร้อง · จ่ายแล้วรวม ${baht(totalPaid)}</p></div>
      <details class="card" style="padding:12px 16px;gap:10px;max-width:100%"><summary>อัตราและอำนาจอนุมัติ</summary>
        <div style="overflow-x:auto"><table class="tbl"><tr><th>ประเภทรถ</th><th class="r">บาท/วัน</th></tr>${Object.values(RATES).map(r => `<tr><td>${esc(r.label)}</td><td class="r num">${r.rate.toLocaleString('th-TH')}</td></tr>`).join('')}</table></div>
        <div style="overflow-x:auto"><table class="tbl"><tr><th>ยอดอนุมัติ</th><th>ต้องอนุมัติถึง</th></tr>
          <tr><td class="num">ไม่เกิน 5,000</td><td>Step 1 · ${TIERS[0].role}</td></tr>
          <tr><td class="num">5,001 – 20,000</td><td>Step 2 · ${TIERS[1].role}</td></tr>
          <tr><td class="num">เกิน 20,000</td><td>Step 3 · ${TIERS[2].role}</td></tr></table></div>
        <p class="small muted">ยอด 20,001–50,000 ยังไม่ได้กำหนด ระบบจำลองนี้ให้ไป Step 3</p>
      </details>
    </div>
    <div class="bo">
      <aside class="stack">
        <div class="filters" role="group" aria-label="ตัวกรอง">${FILTERS.map((x, i) => `<button data-a="boFilter" data-v="${x[0]}" aria-pressed="${UI.boFilter === x[0]}">${x[1]} <span class="num">${counts[i]}</span></button>`).join('')}</div>
        <div class="q">${list.length ? list.map(c => { const cl = claimOf(c); return `
          <button class="qi" data-a="boOpen" data-id="${c.id}" aria-current="${cur && cur.id === c.id}">
            ${plateHTML(cl.plate, cl.province, true)}
            <span><span class="qn">${esc(cl.owner)}</span><br><span class="small muted mono">${c.id}</span></span>
            ${pill(c.status, 'bo')}
            <span class="qm"><span>${esc(RATES[c.type].label)}</span><span class="num">${c.approvedAmount ? baht(c.approvedAmount) : 'ขอ ' + baht(reqAmount(c))}</span></span>
          </button>`; }).join('') : `<p class="muted small" style="padding:12px">ไม่มีคำร้องในกลุ่มนี้</p>`}</div>
      </aside>
      <section class="stack">${cur && list.includes(cur) ? boDetail(cur) : cur ? boDetail(cur) : `<div class="card"><p class="muted">เลือกคำร้องจากรายการ</p></div>`}</section>
    </div></main>`;
}

  return `

    <div class="row between"><div class="row">${plateHTML(cl.plate, cl.province)}<div><h3>${esc(cl.owner)}</h3><p class="small muted mono">${c.id} · ${esc(c.claimNo)}</p></div></div>${pill(c.status, 'bo')}</div>

function chainHTML(c) {
  const need = requiredStep(c.approvedAmount);
  return `<div class="chain">${TIERS.map(t => {
    const a = c.approvals.find(x => x.step === t.step);
    const cls = t.step > need ? 'skip' : a ? 'ok' : t.step === c.approvals.length + 1 ? 'next' : '';
    return `<div class="lv ${cls}"><span class="lvh">Step ${t.step}</span><span>${esc(t.role)}</span><span class="small">${t.step > need ? 'ไม่ต้องอนุมัติ' : a ? `✓ ${esc(a.who)} · ${fmtDT(a.at)}` : cls === 'next' ? 'รออนุมัติ' : 'รอคิว'}</span></div>`;
  }).join('')}</div>`;
}

function boAction(c) {
  const t = UI.t;
  const errBox = UI.err ? `<div class="alert bad" role="alert"><span class="ico">!</span><span>${UI.err}</span></div>` : '';
  if (c.status === 'SUBMITTED') {
    const missing = DOCS.filter(d => !c.docs[d.id]);
    return `<div class="card"><h3>ตรวจเอกสาร</h3>${errBox}
      ${missing.length ? `<div class="alert warn"><span class="ico">!</span><span>ยังขาด: ${missing.map(d => esc(d.label)).join(', ')}</span></div>` : `<div class="alert ok"><span class="ico">✓</span><span>เอกสารครบ ${DOCS.length} รายการ</span></div>`}
      <div class="row"><button class="btn primary" data-a="boDocsOk" ${missing.length ? 'disabled' : ''}>เอกสารครบ ส่งพิจารณาวงเงิน</button><button class="btn ghost" data-a="boToggleNeed">ขอเอกสารเพิ่ม</button></div>
      ${t.needOpen ? `<div class="flat"><span class="small"><b>เลือกเอกสารที่ต้องการ</b></span>
        ${DOCS.map(d => `<label class="check"><input type="checkbox" data-t="need_${d.id}" ${t['need_' + d.id] ? 'checked' : ''}><span>${esc(d.label)}</span></label>`).join('')}
        <div class="field"><label for="bo-note">ข้อความถึงผู้เรียกร้อง</label><textarea class="input" id="bo-note" data-t="note" placeholder="เช่น รูปบัตรประชาชนไม่ชัด กรุณาถ่ายใหม่">${esc(t.note || '')}</textarea></div>
        <button class="btn primary sm" data-a="boNeed" style="align-self:flex-start">ส่งคำขอเอกสาร</button></div>` : ''}</div>`;
  }
  if (c.status === 'UNDER_REVIEW') {
    const rd = reqDays(c), r = RATES[c.type].rate;
    const ad = t.adays ?? rd, amt = (Number(ad) || 0) * r, need = requiredStep(amt);
    const appeal = c.history.slice().reverse().find(h => h.text.startsWith('ขอทบทวน'));
    return `<div class="card"><h3>พิจารณาวงเงิน</h3>${errBox}
      ${c.appealCount && appeal ? `<div class="alert info"><span class="ico">i</span><span><b>ผู้เรียกร้องขอทบทวน:</b> ${esc(appeal.text.replace(/^ขอทบทวน:\s*/, ''))}</span></div>` : ''}
      ${(() => { const cl = claimOf(c), std = SEV[cl.sev].std, rti = rd / std; return `<div class="alert ${rti > 1.3 ? 'warn' : 'info'}"><span class="ico">i</span><span>ความเสียหาย${SEV[cl.sev].label} มาตรฐาน ${std} วัน · ซ่อมจริง ${rd} วันที่ ${esc(garageOf(c).name)} (${GTYPE[garageOf(c).type].label}) · ดัชนีเวลาซ่อม ${rti.toFixed(2)}</span></div>`; })()}
      ${rd > 30 ? `<div class="alert warn"><span class="ico">!</span><span>ระยะเวลาซ่อม ${rd} วัน นานกว่าปกติ ควรตรวจสาเหตุ</span></div>` : ''}
      <div class="grid2">
        <div class="field"><label for="bo-days">จำนวนวันที่อนุมัติ</label><input class="input num" type="number" id="bo-days" data-t="adays" min="0" max="${rd}" value="${esc(ad)}"><span class="hint">ขอมา ${rd} วัน</span></div>
        <div class="field"><label>อัตราต่อวัน</label><div class="input num" style="background:var(--sunk)">${r.toLocaleString('th-TH')} บาท</div></div>
      </div>
      <div class="est" id="boEst"><span class="small" style="color:var(--sign-ink)">ยอดเสนออนุมัติ</span><span class="amt">${baht(amt)}</span><span class="formula">ต้องอนุมัติถึง Step ${need} · ${esc(TIERS[need - 1].role)}</span></div>
      <div class="field"><label for="bo-rcode">เหตุผลที่ปรับลด <span class="muted small">(จำเป็นถ้าน้อยกว่าที่ขอ)</span></label>
        <select class="input" id="bo-rcode" data-t="rcode"><option value="">ไม่ได้ปรับลด</option>${Object.entries(REASONS).map(([k, v]) => `<option value="${k}" ${t.rcode === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
      <div class="field"><label for="bo-reason">รายละเอียดเพิ่มเติม <span class="muted small">(ผู้เรียกร้องจะเห็นข้อความนี้)</span></label><textarea class="input" id="bo-reason" data-t="reason">${esc(t.reason || '')}</textarea></div>
      <button class="btn primary" data-a="boPropose" style="align-self:flex-start">เสนอยอดเข้าสายอนุมัติ</button></div>`;
  }
  if (c.status === 'PENDING_APPROVAL') {
    const next = TIERS[c.approvals.length];
    return `<div class="card"><h3>สายอนุมัติวงเงิน</h3>
      <div class="row between"><span>ยอดเสนอ <b class="num">${baht(c.approvedAmount)}</b> <span class="muted small">(${c.approvedDays} วัน × ${RATES[c.type].rate.toLocaleString('th-TH')})</span></span></div>
      ${c.adjustReason ? `<p class="small"><b>เหตุผลปรับลด:</b> ${esc(c.adjustReason)}</p>` : ''}
      ${chainHTML(c)}
      <div class="row"><button class="btn primary" data-a="boApprove">อนุมัติในฐานะ Step ${next.step} (${esc(next.who)})</button><button class="btn danger" data-a="boReturn">ตีกลับให้พิจารณาใหม่</button></div></div>`;
  }
  if (c.status === 'OFFERED') return `<div class="card"><h3>แจ้งผลแล้ว</h3><p>ยอดอนุมัติ <b class="num">${baht(c.approvedAmount)}</b> รอผู้เรียกร้องตอบรับ</p>${chainHTML(c)}
    <p class="small muted">ลองสลับไปมุมมองผู้เรียกร้อง แล้วเปิดคำร้อง ${c.id} เพื่อตอบรับ</p></div>`;
  if (c.status === 'ACCEPTED' || c.status === 'PAYMENT_FAILED' || c.status === 'PAID') {
    const lg = UI.bankLog[c.id] || c.payment?.log;
    return `<div class="card"><h3>${c.status === 'PAID' ? 'การจ่ายเงิน' : 'ฝ่ายการเงิน: โอนเงิน'}</h3>
      <dl class="kv"><dt>ผู้รับเงิน</dt><dd>${esc(c.holder)}</dd><dt>บัญชี</dt><dd>${esc(c.bank.name)} ${esc(c.bank.acct)}</dd><dt>ยอดเงิน</dt><dd class="num">${baht(c.approvedAmount)}</dd><dt>ลงนามตอบรับ</dt><dd>${c.signedAt ? fmtDT(c.signedAt) : '–'}</dd></dl>
      ${c.status === 'ACCEPTED' ? `<div class="alert ok"><span class="ico">✓</span><span>ชื่อบัญชีตรงกับเจ้าของรถตามทะเบียน</span></div><button class="btn primary" data-a="boPay" style="align-self:flex-start">โอนเงินผ่าน API ธนาคาร (จำลอง)</button>` : ''}
      ${c.status === 'PAYMENT_FAILED' ? `<div class="alert warn"><span class="ico">!</span><span>รอผู้เรียกร้องแก้ไขบัญชี</span></div>` : ''}
      ${lg ? `<div class="console" aria-label="บันทึกการเรียก API">${esc(lg)}</div>` : ''}
      ${c.status === 'PAID' ? `<div class="row"><button class="btn ghost sm" data-a="docLetter" data-id="${c.id}">หนังสือยืนยันการจ่ายเงิน</button><button class="btn ghost sm" data-a="docConsent" data-id="${c.id}">หนังสือยินยอม</button></div>` : ''}</div>`;
  }
  return `<div class="card"><h3>รอผู้เรียกร้อง</h3><p class="muted">${esc(ST[c.status].bo)} ไม่มีงานที่ต้องทำในตอนนี้</p></div>`;
}

/* =================== MANAGER REPORT =================== */
const DMS = 864e5;
const subAt = c => Date.parse(c.history[0].at);
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const avg = (a, f) => a.length ? sum(a, f) / a.length : 0;
const lin = (v, good, bad) => Math.max(0, Math.min(100, 100 * (bad - v) / (bad - good)));
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(Math.round(n));
const GRADE = { A:['ok', 'ดีมาก'], B:['info', 'ดี'], C:['warn', 'พอใช้'], D:['bad', 'ต้องปรับปรุง'] };
const gradeOf = s => s >= 80 ? 'A' : s >= 65 ? 'B' : s >= 50 ? 'C' : 'D';
const rtiColor = r => r <= 1.0 ? 'var(--st-good)' : r <= 1.3 ? 'var(--st-warn)' : 'var(--st-crit)';
const tipAttr = t => `data-tip="${esc(t)}"`;
const idChips = list => list.slice(0, 6).map(c => `<button class="idchip" data-a="boJump" data-id="${c.id}">${c.id.slice(-4)}</button>`).join(' ') + (list.length > 6 ? ` <span class="small muted">+${list.length - 6}</span>` : '');

// แต่ละเคสที่ซ่อมเสร็จ → ตัวชี้วัดของอู่
function repairRows(cases) {
  const rows = cases.filter(c => c.repairOut).map(c => {
    const g = garageOf(c), sev = claimOf(c).sev, std = SEV[sev].std, d = reqDays(c);
    const pay = c.approvedDays ?? d, rate = RATES[c.type].rate;
    return { c, g, sev, std, d, rti: d / std, on: c.expectedOut ? c.repairOut <= c.expectedOut : d <= std,
      excess: Math.max(0, pay - std) * rate, lou: c.approvedAmount ?? d * rate, repair: c.repairCost || 0 };
  });
  const sevAvg = {};
  Object.keys(SEV).forEach(k => { const r = rows.filter(x => x.sev === k); sevAvg[k] = r.length ? avg(r, x => x.repair + x.lou) : 1; });
  rows.forEach(x => { x.total = x.repair + x.lou; x.ci = x.total / sevAvg[x.sev]; });
  return rows;
}
function garageScore(rs) {
  const rti = avg(rs, x => x.rti), on = avg(rs, x => x.on ? 1 : 0), ci = avg(rs, x => x.ci);
  return { n: rs.length, rti, on, ci, days: avg(rs, x => x.d), excess: sum(rs, x => x.excess),
    score: Math.round(0.5 * lin(rti, 1.0, 1.6) + 0.25 * on * 100 + 0.25 * lin(ci, 0.9, 1.3)) };
}

function renderReport() {
  const now = Date.now(), P = UI.rp === '30' ? 30 : UI.rp === '90' ? 90 : 3650, from = now - P * DMS;
  const all = S.cases, sub = all.filter(c => subAt(c) >= from);
  const open = all.filter(c => c.status !== 'PAID');
  const paidP = all.filter(c => c.status === 'PAID' && Date.parse(c.payment.at) >= from);
  const ageD = c => (now - Date.parse(c.statusAt || c.history[c.history.length - 1].at)) / DMS;
  const exposure = sum(open, c => c.approvedAmount ?? reqAmount(c));
  const lead = avg(paidP, c => (Date.parse(c.payment.at) - subAt(c)) / DMS);

  /* --- alerts --- */
  const overdue = open.filter(c => SLA[c.status] && ageD(c) > SLA[c.status]);
  const step3 = all.filter(c => c.status === 'PENDING_APPROVAL' && requiredStep(c.approvedAmount) === 3 && c.approvals.length === 2);
  const nearLine = all.filter(c => c.approvedAmount && c.approvedAmount < reqAmount(c) && [5000, 20000].some(L => c.approvedAmount <= L && c.approvedAmount > L * 0.9 && reqAmount(c) > L));
  const byAcct = {}; all.forEach(c => (byAcct[c.bank.acct] = byAcct[c.bank.acct] || []).push(c));
  const dupAcct = Object.values(byAcct).filter(a => a.length > 1).flat();
  const longRepair = sub.filter(c => c.repairOut && reqDays(c) > 30);
  const failed = all.filter(c => c.status === 'PAYMENT_FAILED');
  const alerts = [
    ['var(--st-crit)', '!', 'งานเกิน SLA ฝั่งบริษัท', 'ค้างนานกว่ากำหนดในขั้นตรวจเอกสาร พิจารณา อนุมัติ หรือรอโอน', overdue],
    ['var(--st-warn)', '!', 'รอคุณอนุมัติที่ Step 3', 'ผ่าน Step 1 และ 2 แล้ว', step3],
    ['var(--st-crit)', '!', 'ปรับลดจนต่ำกว่าเส้นอำนาจอนุมัติ', 'ยอดขอเกินเส้น 5,000/20,000 แต่ยอดอนุมัติอยู่ใต้เส้นไม่เกิน 10%', nearLine],
    ['var(--st-crit)', '!', 'บัญชีรับเงินซ้ำหลายคำร้อง', 'เลขบัญชีเดียวกันในคำร้องต่างเคลม', dupAcct],
    ['var(--st-warn)', '!', 'ซ่อมนานเกิน 30 วัน', 'ในช่วงเวลาที่เลือก', longRepair],
    ['var(--st-crit)', '✕', 'โอนเงินไม่สำเร็จ', 'รอผู้เรียกร้องแก้บัญชี', failed],
  ].filter(a => a[4].length);

  /* --- monthly paid trend (4 months) --- */
  const months = [3, 2, 1, 0].map(k => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - k); return d; });
  const mData = months.map((d, i) => {
    const list = all.filter(c => c.status === 'PAID' && (p => p.getFullYear() === d.getFullYear() && p.getMonth() === d.getMonth())(new Date(c.payment.at)));
    return { label: d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }) + (i === 3 ? ' (ถึงวันนี้)' : ''), n: list.length, amt: sum(list, c => c.approvedAmount) };
  });
  const mMax = Math.max(1, ...mData.map(m => m.amt)), step = Math.pow(10, Math.floor(Math.log10(mMax))) * (mMax / Math.pow(10, Math.floor(Math.log10(mMax))) > 5 ? 2 : 1);
  const yMax = Math.ceil(mMax / step) * step || 1, ticks = [0.5, 1].map(f => yMax * f);
  const trend = `<div class="vb" role="img" aria-label="ยอดจ่ายรายเดือน">
      ${ticks.map(v => `<div class="gl" style="bottom:${v / yMax * 100}%"><span>${short(v)}</span></div>`).join('')}
      ${mData.map(m => `<div class="col" ${tipAttr(`${m.label}: จ่าย ${m.n} เคส · ${baht(m.amt)}`)}><span class="val">${short(m.amt)}</span><div class="bar" style="height:${m.amt / yMax * 100}%"></div></div>`).join('')}
    </div><div class="vx">${mData.map(m => `<span>${m.label}<br>${m.n} เคส</span>`).join('')}</div>`;

  /* --- pipeline & aging --- */
  const STAGES = [['ตรวจเอกสาร', ['SUBMITTED']], ['พิจารณายอด', ['UNDER_REVIEW']], ['รออนุมัติ', ['PENDING_APPROVAL']], ['รอโอนเงิน', ['ACCEPTED']],
    ['รอผู้เรียกร้องตอบรับ', ['OFFERED']], ['รอเอกสาร / รถซ่อม', ['NEED_INFO', 'WAITING_REPAIR', 'PAYMENT_FAILED']]];
  const BK = [['0–2 วัน', 'var(--o1)', a => a <= 2], ['3–5 วัน', 'var(--o2)', a => a > 2 && a <= 5], ['เกิน 5 วัน', 'var(--o3)', a => a > 5]];
  const pRows = STAGES.map(([lab, sts]) => { const l = open.filter(c => sts.includes(c.status)); return { lab, l, b: BK.map(k => l.filter(c => k[2](ageD(c)))), over: l.filter(c => SLA[c.status] && ageD(c) > SLA[c.status]).length }; });
  const pMax = Math.max(1, ...pRows.map(r => r.l.length));
  const pipeline = `<div class="legend">${BK.map(k => `<span><i class="sw" style="background:${k[1]}"></i>${k[0]}</span>`).join('')}<span>นับจากวันที่เข้าสถานะ</span></div>
    <div>${pRows.map(r => `<div class="hb"><span>${r.lab}${r.over ? ` <span class="sdot small" style="--c:var(--st-crit)">${r.over} เกิน SLA</span>` : ''}</span>
      <div class="track" style="width:${r.l.length / pMax * 100}%">${r.b.map((l, i) => l.length ? `<div class="sgm" style="flex:${l.length};background:${BK[i][1]}" ${tipAttr(`${r.lab} · ${BK[i][0]}: ${l.length} เคส`)}></div>` : '').join('')}</div>
      <span class="n">${r.l.length}</span></div>`).join('')}</div>`;

  /* --- approval steps --- */
  const appr = TIERS.map(tr => {
    const waiting = all.filter(c => c.status === 'PENDING_APPROVAL' && c.approvals.length === tr.step - 1 && requiredStep(c.approvedAmount) >= tr.step);
    const durs = []; all.forEach(c => { const a = c.approvals.find(x => x.step === tr.step); if (!a || Date.parse(a.at) < from) return;
      const prev = tr.step === 1 ? c.proposedAt : c.approvals.find(x => x.step === tr.step - 1)?.at; if (prev) durs.push((Date.parse(a.at) - Date.parse(prev)) / 36e5); });
    return { tr, waiting, n: durs.length, hrs: durs.length ? sum(durs, x => x) / durs.length : 0 };
  });

  /* --- requested vs approved --- */
  const decided = sub.filter(c => c.approvedAmount);
  const reqT = sum(decided, c => reqAmount(c)), apT = sum(decided, c => c.approvedAmount);
  const reasons = Object.keys(REASONS).map(k => ({ k, n: decided.filter(c => c.reasonCode === k).length, cut: sum(decided.filter(c => c.reasonCode === k), c => reqAmount(c) - c.approvedAmount) })).filter(r => r.n).sort((a, b) => b.cut - a.cut);
  const rMax = Math.max(1, ...reasons.map(r => r.cut));

  /* --- garages --- */
  const rows = repairRows(sub);
  const byType = Object.keys(GTYPE).map(tp => ({ tp, rs: rows.filter(x => x.g.type === tp) })).map(o => ({ ...o, sc: garageScore(o.rs), repair: avg(o.rs, x => x.repair), lou: avg(o.rs, x => x.lou) }));
  const [dl, gn] = byType;
  const cmpRows = [
    ['จำนวนเคสที่ซ่อมเสร็จ', o => o.sc.n, v => v, null],
    ['วันซ่อมเฉลี่ย', o => o.sc.days, v => v.toFixed(1) + ' วัน', 'low'],
    ['ดัชนีเวลาซ่อม (RTI)', o => o.sc.rti, v => v.toFixed(2), 'low'],
    ['ซ่อมเสร็จตรงวันนัด', o => o.sc.on, v => Math.round(v * 100) + '%', 'high'],
    ['ค่าซ่อมเฉลี่ย/เคส', o => o.repair, v => baht(Math.round(v)), 'low'],
    ['ค่าขาดประโยชน์เฉลี่ย/เคส', o => o.lou, v => baht(Math.round(v)), 'low'],
    ['ต้นทุนรวมเฉลี่ย/เคส', o => o.repair + o.lou, v => baht(Math.round(v)), 'low'],
    ['ค่าขาดประโยชน์ส่วนเกินจากความล่าช้า', o => o.sc.excess, v => baht(Math.round(v)), 'low'],
  ];
  const cmp = `<div class="tblwrap"><table class="tbl cmp"><tr><th>ตัวชี้วัด</th><th class="r">${GTYPE.dealer.label}</th><th class="r">${GTYPE.general.label}</th></tr>
    ${cmpRows.map(([l, f, fmt, dir]) => { const a = f(dl), b = f(gn), best = !dir || a === b ? '' : (dir === 'low') === (a < b) ? 'a' : 'b';
      return `<tr><td>${l}</td><td class="r num ${best === 'a' ? 'best' : ''}">${fmt(a)}</td><td class="r num ${best === 'b' ? 'best' : ''}">${fmt(b)}</td></tr>`; }).join('')}</table></div>`;
  const cMax = Math.max(1, ...byType.map(o => o.repair + o.lou));
  const costBar = `<div class="legend"><span><i class="sw" style="background:var(--s1)"></i>ค่าซ่อม</span><span><i class="sw" style="background:var(--s2)"></i>ค่าขาดประโยชน์</span></div>
    ${byType.map(o => `<div class="hb"><span>${GTYPE[o.tp].label}</span><div class="track" style="width:${(o.repair + o.lou) / cMax * 100}%">
      <div class="sgm" style="flex:${o.repair};background:var(--s1)" ${tipAttr(`${GTYPE[o.tp].label} · ค่าซ่อมเฉลี่ย ${baht(Math.round(o.repair))}`)}></div>
      <div class="sgm" style="flex:${Math.max(o.lou, 1)};background:var(--s2)" ${tipAttr(`${GTYPE[o.tp].label} · ค่าขาดประโยชน์เฉลี่ย ${baht(Math.round(o.lou))}`)}></div></div>
      <span class="n">${short(o.repair + o.lou)}</span></div>`).join('')}`;
  const sevTbl = `<div class="tblwrap"><table class="tbl"><tr><th>ระดับความเสียหาย</th><th class="r">มาตรฐาน</th><th class="r">${GTYPE.dealer.label}</th><th class="r">${GTYPE.general.label}</th></tr>
    ${Object.entries(SEV).map(([k, v]) => { const f = tp => { const r = rows.filter(x => x.sev === k && x.g.type === tp); return r.length ? avg(r, x => x.d).toFixed(1) : '–'; };
      return `<tr><td>${v.label}</td><td class="r num">${v.std}</td><td class="r num">${f('dealer')}</td><td class="r num">${f('general')}</td></tr>`; }).join('')}</table></div>`;
  // scorecard
  const gmap = {}; rows.forEach(x => (gmap[x.g.id] = gmap[x.g.id] || { g: x.g, rs: [] }).rs.push(x));
  let cards = Object.values(gmap).map(o => ({ ...o, sc: garageScore(o.rs) }));
  const sorters = { score: (a, b) => a.sc.score - b.sc.score, rti: (a, b) => b.sc.rti - a.sc.rti, excess: (a, b) => b.sc.excess - a.sc.excess };
  cards.sort(sorters[UI.gsort] || sorters.score);
  const watch = cards.filter(o => o.sc.n >= 3 && gradeOf(o.sc.score) === 'D');
  const dayGap = gn.sc.days - dl.sc.days, costGap = (dl.repair + dl.lou) - (gn.repair + gn.lou);
  const insight = dl.sc.n && gn.sc.n ? `อู่นอกซ่อมนานกว่าอู่ห้างเฉลี่ย <b>${dayGap.toFixed(1)} วัน</b> (RTI ${gn.sc.rti.toFixed(2)} เทียบ ${dl.sc.rti.toFixed(2)})
      ${costGap > 0 ? `แต่ต้นทุนรวมต่อเคสยังต่ำกว่า <b>${baht(Math.round(costGap))}</b> เพราะค่าซ่อมถูกกว่า` : `และต้นทุนรวมต่อเคสสูงกว่า <b>${baht(Math.round(-costGap))}</b>`}
      · ค่าขาดประโยชน์ส่วนเกินจากความล่าช้ารวม <b>${baht(Math.round(dl.sc.excess + gn.sc.excess))}</b> โดย ${Math.round(gn.sc.excess / Math.max(1, dl.sc.excess + gn.sc.excess) * 100)}% มาจากอู่นอก
      ${watch.length ? `<br>อู่ที่ควรเรียกคุยหรือพิจารณาถอดออกจากรายชื่อแนะนำ: <b>${watch.map(o => esc(o.g.name)).join(', ')}</b>` : ''}` : 'ยังมีข้อมูลไม่พอสำหรับเปรียบเทียบ';
  const score = `<div class="tblwrap"><table class="tbl"><tr><th>อู่</th><th class="r">เคส</th><th class="r">วันเฉลี่ย</th><th>ดัชนีเวลาซ่อม</th><th class="r">ตรงนัด</th><th class="r">ส่วนเกินจากความล่าช้า</th><th class="r">คะแนน</th><th>เกรด</th></tr>
    ${cards.map(o => { const gr = gradeOf(o.sc.score); return `<tr><td>${esc(o.g.name)} ${gBadge(o.g)}${o.sc.n < 3 ? ' <span class="small muted">ข้อมูลน้อย</span>' : ''}</td>
      <td class="r num">${o.sc.n}</td><td class="r num">${o.sc.days.toFixed(1)}</td>
      <td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="rti" ${tipAttr(`RTI ${o.sc.rti.toFixed(2)} · เส้นกลาง = 1.00 (ตามมาตรฐาน)`)}><b style="width:${Math.min(100, o.sc.rti / 2 * 100)}%;background:${rtiColor(o.sc.rti)}"></b><i></i></span><span class="num small">${o.sc.rti.toFixed(2)}</span></span></td>
      <td class="r num">${Math.round(o.sc.on * 100)}%</td><td class="r num">${baht(Math.round(o.sc.excess))}</td>
      <td class="r num"><b>${o.sc.score}</b></td><td><span class="pill ${GRADE[gr][0]}">${gr} · ${GRADE[gr][1]}</span></td></tr>`; }).join('')}</table></div>`;

  const kpi = (l, v, d) => `<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span><span class="d">${d}</span></div>`;
  const per = { '30':'30 วันล่าสุด', '90':'90 วันล่าสุด', all:'ทั้งหมด' }[UI.rp];
  return `
  <div class="rtop"><div><h2>รายงานผู้จัดการฝ่ายสินไหม</h2><p class="small muted">ข้อมูลจำลอง ณ ${fmtDT(new Date().toISOString())}</p></div>
    <div class="filters" role="group" aria-label="ช่วงเวลา">${[['30', '30 วัน'], ['90', '90 วัน'], ['all', 'ทั้งหมด']].map(([v, l]) => `<button data-a="rp" data-v="${v}" aria-pressed="${UI.rp === v}">${l}</button>`).join('')}</div></div>
  <div class="kpis" style="margin-bottom:16px">
    ${kpi('คำร้องใหม่', sub.length, per)}
    ${kpi('งานค้างตอนนี้', open.length, `${overdue.length} เคสเกิน SLA ฝั่งบริษัท`)}
    ${kpi('จ่ายแล้ว', baht(sum(paidP, c => c.approvedAmount)), `${paidP.length} เคส · ${per}`)}
    ${kpi('ยอดที่คาดว่าต้องจ่าย', baht(exposure), 'จากงานค้างทั้งหมด')}
    ${kpi('ยื่น → ได้เงิน เฉลี่ย', lead.toFixed(1) + ' วัน', `เคสที่จ่ายใน${per}`)}
  </div>
  <div class="rgrid">
    <section class="card span2"><div class="sec-h"><h3>ต้องดูวันนี้</h3><span class="small muted">กดเลขคำร้องเพื่อเปิด</span></div>
      ${alerts.length ? `<div class="alist">${alerts.map(([c, ic, t, d, l]) => `<div class="arow"><span class="ai" style="--c:${c}">${ic}</span><div><b>${t}</b><div class="small muted">${d}</div><div style="margin-top:6px">${idChips(l)}</div></div><span class="ac">${l.length}</span></div>`).join('')}</div>` : `<div class="alert ok"><span class="ico">✓</span><span>ไม่มีเรื่องผิดปกติ</span></div>`}
    </section>

    <section class="card"><div class="sec-h"><h3>ยอดจ่ายรายเดือน</h3><span class="small muted">บาท</span></div>${trend}</section>
    <section class="card"><div class="sec-h"><h3>งานค้างและอายุงาน</h3><span class="small muted">${open.length} เคส</span></div>${pipeline}</section>

    <section class="card"><h3>สายอนุมัติวงเงิน</h3>
      <div class="tblwrap"><table class="tbl"><tr><th>Step</th><th class="r">รออยู่</th><th class="r">อนุมัติแล้ว</th><th class="r">เวลาเฉลี่ย</th></tr>

function wizValidate() {
  const w = UI.wiz, f = w.f;
  if (w.step === 1) {
    if (!/^0\d{9}$/.test(f.phone)) return 'กรอกเบอร์มือถือ 10 หลัก ขึ้นต้นด้วย 0';
    if (!w.otpSent) return 'กด "ขอรหัส OTP" ก่อน';
    if (f.otp !== OTP) return 'รหัส OTP ไม่ถูกต้อง ลองอีกครั้ง';
    if (!f.pdpa) return 'กรุณาให้ความยินยอมการใช้ข้อมูลเพื่อดำเนินการต่อ';
  }
  if (w.step === 2) {
    if (!f.garage) return 'เลือกอู่ที่ซ่อมรถ';
    if (f.garage === 'other' && (!f.garageName.trim() || !f.garageType)) return 'กรอกชื่ออู่และเลือกประเภทอู่';
    if (!f.repairIn) return 'กรอกวันที่รถเข้าซ่อม';
    if (f.repairIn < w.claim.accident) return 'วันที่รถเข้าซ่อมต้องไม่ก่อนวันเกิดเหตุ';
    if (f.repairIn > todayISO()) return 'วันที่รถเข้าซ่อมต้องไม่เกินวันนี้';
    if (!f.repairOut) return 'กรอกวันที่รับรถคืน หรือวันที่อู่นัดรับรถ';
    if (f.repairOut < f.repairIn) return 'วันที่รับรถคืนต้องไม่ก่อนวันที่รถเข้าซ่อม';
    if (f.repairOut > plusDays(120)) return 'วันที่อู่นัดรับรถต้องไม่เกิน 120 วันจากวันนี้';
    if (!f.bank) return 'เลือกธนาคาร';
    if (!/^\d{10,12}$/.test(f.acct)) return 'เลขบัญชีต้องเป็นตัวเลข 10–12 หลัก';
  }
  if (w.step === 3) {
    const miss = DOCS.filter(d => !(d.id === 'repairOut' && isFuture(f.repairOut)) && !w.docs[d.id]);
    if (miss.length) return 'ยังขาดเอกสาร: ' + miss.map(d => d.label).join(', ');
  }
  return '';
}
function verify() {
  const w = UI.wiz;
  w.claim = null;
  const c = CLAIMS.find(x => x.claimNo === w.f.claimNo.trim().toUpperCase());
  if (!c || normPlate(c.plate) !== normPlate(w.f.plate)) return w.err = 'ไม่พบเลขเคลมนี้คู่กับทะเบียนรถที่กรอก ตรวจตัวอักษรบนใบเคลมอีกครั้ง';
  if (c.role !== 'victim') return w.err = 'จากผลสำรวจภัย รถคันนี้เป็นฝ่ายผิดในเหตุการณ์ จึงยื่นค่าขาดประโยชน์ผ่านช่องทางนี้ไม่ได้ หากไม่เห็นด้วยติดต่อ 1234 (จำลอง)';
  const dup = S.cases.find(x => x.claimNo === c.claimNo);

  if (addYears(c.accident, 2) < todayISO()) return w.err = 'เกินกำหนดยื่น 2 ปีนับจากวันเกิดเหตุแล้ว';
  w.err = ''; w.claim = c;
}

  verify: () => verify(),
  wizBack: () => { UI.wiz.err = ''; UI.wiz.step -= 1; },
  wizNext: () => { const e = wizValidate(); UI.wiz.err = e; if (!e) UI.wiz.step += 1; },
  sendOtp: () => { const p = UI.wiz.f.phone; if (!/^0\d{9}$/.test(p)) { UI.wiz.err = 'กรอกเบอร์มือถือ 10 หลัก ขึ้นต้นด้วย 0'; return; } UI.wiz.err = ''; UI.wiz.otpSent = true; },
  sampleDoc: b => { if (b.dataset.doc) UI.wiz.docs[b.dataset.doc] = sampleName(b.dataset.doc); else UI.t['doc_' + b.dataset.cdoc] = sampleName(b.dataset.cdoc); },
  sampleAll: () => DOCS.forEach(d => { if (!(d.id === 'repairOut' && isFuture(UI.wiz.f.repairOut))) UI.wiz.docs[d.id] = sampleName(d.id); }),
  submit: () => submit(),
  copy: b => { const v = b.dataset.v; try { navigator.clipboard.writeText(v).then(() => { b.textContent = 'คัดลอกแล้ว'; }, () => {}); } catch (e) {} return false; },
  openCase: b => { UI.view = 'claimant'; UI.caseId = b.dataset.id; UI.page = 'case'; UI.err = ''; UI.t = {}; UI.wiz.err = ''; },
  lookup: () => { const c = getCase((UI.t.tid || '').trim().toUpperCase()); if (!c || c.phone !== (UI.t.tph || '').trim()) { UI.err = 'ไม่พบคำร้อง ตรวจเลขคำร้องและเบอร์มือถืออีกครั้ง'; return; } UI.err = ''; UI.caseId = c.id; UI.page = 'case'; UI.t = {}; },
  sendRepairOut: () => {
    const c = getCase(UI.caseId), out = UI.t.out;
    if (!out || out < c.repairIn || out > todayISO()) { UI.err = 'กรอกวันที่รับรถคืนให้ถูกต้อง (ไม่ก่อนวันเข้าซ่อม และไม่เกินวันนี้)'; return; }
    if (!UI.t.doc_repairOut) { UI.err = 'แนบใบส่งมอบรถ'; return; }
    c.repairOut = out; c.docs.repairOut = UI.t.doc_repairOut; setStatus(c, 'SUBMITTED');
    log(c, `ส่งวันที่รับรถคืน ${fmtD(out)} และใบส่งมอบรถ`, 'claimant'); save(); UI.t = {}; UI.err = '';
  },
  sendMore: () => {
    const c = getCase(UI.caseId), need = c.needInfo?.docs || [];
    const miss = need.filter(id => !UI.t['doc_' + id]);
    if (miss.length) { UI.err = 'ยังไม่ได้แนบ: ' + miss.map(docLabel).join(', '); return; }
    need.forEach(id => { c.docs[id] = UI.t['doc_' + id]; });
    setStatus(c, 'SUBMITTED'); delete c.needInfo; log(c, 'ส่งเอกสารเพิ่ม: ' + need.map(docLabel).join(', '), 'claimant'); save(); UI.t = {}; UI.err = '';
  },
  openSign: () => { UI.modal = { type:'sign', id:UI.caseId }; UI.err = ''; UI.t = {}; },
  openAppeal: () => { UI.modal = { type:'appeal', id:UI.caseId }; UI.err = ''; UI.t = {}; },
  closeModal: () => { UI.modal = null; UI.err = ''; },
  ovClose: (b, e) => { if (e.target === b) { UI.modal = null; UI.err = ''; } else return false; },
  sign: () => {
    if (UI.t.sotp !== OTP) { UI.err = 'รหัส OTP ไม่ถูกต้อง'; return; }
    const c = getCase(UI.modal.id); setStatus(c, 'ACCEPTED'); c.signedAt = new Date().toISOString();
    log(c, `ลงนามตอบรับผลพิจารณา ${baht(c.approvedAmount)} ด้วย OTP`, 'claimant'); save(); UI.modal = null; UI.t = {}; UI.err = '';
  },
  appeal: () => {
    const why = (UI.t.why || '').trim(); if (why.length < 10) { UI.err = 'อธิบายเหตุผลอย่างน้อย 10 ตัวอักษร'; return; }
    const c = getCase(UI.modal.id); setStatus(c, 'UNDER_REVIEW'); c.appealCount += 1; c.approvals = []; delete c.adjustReason; delete c.reasonCode;
    log(c, 'ขอทบทวน: ' + why, 'claimant'); save(); UI.modal = null; UI.t = {}; UI.err = '';
  },
  fixBank: () => {
    const c = getCase(UI.caseId), acct = (UI.t.acct || '').trim();
    if (!/^\d{10,12}$/.test(acct)) { UI.err = 'เลขบัญชีต้องเป็นตัวเลข 10–12 หลัก'; return; }
    c.bank = { name: UI.t.bank || c.bank.name, acct }; setStatus(c, 'ACCEPTED'); delete UI.bankLog[c.id];
    log(c, `แก้ไขบัญชีรับเงินเป็น ${c.bank.name} ${maskAcct(acct)}`, 'claimant'); save(); UI.t = {}; UI.err = '';
  },
  docLetter: b => { UI.modal = { type:'letter', id:b.dataset.id }; },
  docConsent: b => { UI.modal = { type:'consent', id:b.dataset.id }; },
  // back office
  boFilter: b => { UI.boFilter = b.dataset.v; UI.boId = null; UI.t = {}; UI.err = ''; },
  boTab: b => { UI.boTab = b.dataset.v; UI.t = {}; UI.err = ''; window.scrollTo(0, 0); },
  rp: b => { UI.rp = b.dataset.v; },
  flowSel: b => { UI.flowSel = b.dataset.k; },
  gsort: b => { UI.gsort = b.dataset.v; },
  boJump: b => { UI.view = 'bo'; UI.boTab = 'queue'; UI.boFilter = 'all'; UI.boId = b.dataset.id; UI.t = {}; UI.err = ''; window.scrollTo(0, 0); },
  boOpen: b => { UI.boId = b.dataset.id; UI.t = {}; UI.err = ''; },
  boToggleNeed: () => { UI.t.needOpen = !UI.t.needOpen; },
  boDocsOk: () => { const c = curBO(); setStatus(c, 'UNDER_REVIEW'); log(c, 'ตรวจเอกสารครบถ้วน ส่งพิจารณาวงเงิน', 'company'); save(); UI.t = {}; },
  boNeed: () => {
    const c = curBO(), ids = DOCS.filter(d => UI.t['need_' + d.id]).map(d => d.id);
    if (!ids.length) { UI.err = 'เลือกเอกสารอย่างน้อย 1 รายการ'; return; }
    c.needInfo = { docs: ids, note: (UI.t.note || '').trim() }; setStatus(c, 'NEED_INFO');
    log(c, 'ขอเอกสารเพิ่ม: ' + ids.map(docLabel).join(', '), 'company'); save(); UI.t = {}; UI.err = '';
  },
  boPropose: () => {
    const c = curBO(), rd = reqDays(c), ad = Number(UI.t.adays ?? rd), reason = (UI.t.reason || '').trim();
    if (!Number.isInteger(ad) || ad < 1 || ad > rd) { UI.err = `จำนวนวันต้องอยู่ระหว่าง 1–${rd}`; return; }
    const rcode = UI.t.rcode || '';
    if (ad < rd && !rcode) { UI.err = 'อนุมัติน้อยกว่าที่ขอ ต้องเลือกเหตุผลที่ปรับลด'; return; }
    if (rcode === 'other' && reason.length < 5) { UI.err = 'เลือก "อื่น ๆ" ต้องกรอกรายละเอียด'; return; }
    const r = RATES[c.type].rate; c.approvedDays = ad; c.approvedAmount = ad * r; c.approvals = [];
    if (ad < rd) { c.reasonCode = rcode; c.adjustReason = REASONS[rcode] + (reason ? ' — ' + reason : ''); } else { delete c.adjustReason; delete c.reasonCode; }
    c.proposedAt = new Date().toISOString();
    setStatus(c, 'PENDING_APPROVAL');
    log(c, `เสนอยอด ${ad} วัน × ${r.toLocaleString('th-TH')} = ${baht(c.approvedAmount)} (ต้องอนุมัติถึง Step ${requiredStep(c.approvedAmount)})`, 'company'); save(); UI.t = {}; UI.err = '';
  },
  boApprove: () => {
    const c = curBO(), t = TIERS[c.approvals.length];
    c.approvals.push({ step:t.step, who:t.who, at:new Date().toISOString() });
    if (c.approvals.length >= requiredStep(c.approvedAmount)) { setStatus(c, 'OFFERED'); log(c, `Step ${t.step} อนุมัติ (${t.who}) แจ้งผลพิจารณาแล้ว`, 'company'); }
    else log(c, `Step ${t.step} อนุมัติ (${t.who})`, 'company');
    save();
  },
  boReturn: () => { const c = curBO(); setStatus(c, 'UNDER_REVIEW'); c.approvals = []; log(c, 'ตีกลับให้พิจารณายอดใหม่', 'company'); save(); },
  boPay: () => {
    const c = curBO(), now = new Date(), ref = 'BNK' + now.toISOString().replace(/\D/g, '').slice(2, 14);
    const fail = /0000$/.test(c.bank.acct);
    const req = { endpoint:'POST /v1/transfers', idempotencyKey:c.id + '-' + (c.history.length), amount:c.approvedAmount, currency:'THB', toBank:c.bank.name, toAccount:c.bank.acct, accountName:c.holder, reference:c.id };
    const res = fail ? { status:422, code:'ACCOUNT_INVALID', message:'Destination account closed or name mismatch' } : { status:200, code:'SUCCESS', transactionRef:ref, settledAt:now.toISOString() };
    const lg = '→ ' + JSON.stringify(req, null, 2) + '\n← ' + JSON.stringify(res, null, 2);
    UI.bankLog[c.id] = lg;
    if (fail) { setStatus(c, 'PAYMENT_FAILED'); c.payment = { error:'ธนาคารปฏิเสธการโอน: บัญชีปลายทางปิดแล้วหรือชื่อบัญชีไม่ตรง', log:lg }; log(c, 'โอนเงินไม่สำเร็จ (ACCOUNT_INVALID)', 'system'); }
    else { setStatus(c, 'PAID'); c.payment = { ref, at:now.toISOString(), log:lg }; log(c, `โอนเงินสำเร็จ อ้างอิง ${ref} ออกหนังสือยืนยันแล้ว`, 'system'); }
    save();
  },
};
const curBO = () => getCase(UI.boId) || (() => { const f = FILTERS.find(x => x[0] === UI.boFilter); return S.cases.filter(c => f[2].includes(c.status))[0]; })();

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const fn = A[b.dataset.a]; if (!fn) return;
  if (fn(b, e) === false) return;
  render();
});
document.addEventListener('input', e => {
  const el = e.target, val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.w) {
    UI.wiz.f[el.dataset.w] = val;
    if (['repairIn', 'repairOut'].includes(el.dataset.w) && $('#est')) { const f = UI.wiz.f; $('#est').innerHTML = estBox(UI.wiz.claim.type, f.repairIn, f.repairOut); }
  } else if (el.dataset.t) {
    UI.t[el.dataset.t] = val;
    if (el.dataset.t === 'adays' && $('#boEst')) {
      const c = curBO(), amt = (Number(val) || 0) * RATES[c.type].rate, need = requiredStep(amt);
      $('#boEst').innerHTML = `<span class="small" style="color:var(--sign-ink)">ยอดเสนออนุมัติ</span><span class="amt">${baht(amt)}</span><span class="formula">ต้องอนุมัติถึง Step ${need} · ${esc(TIERS[need - 1].role)}</span>`;
    }
  } else if (el.dataset.calc) {
    UI.calc[el.dataset.calc] = val;
    const r = RATES[UI.calc.type].rate, d = Math.max(0, Number(UI.calc.days) || 0);
    $('#calcOut').innerHTML = `<span class="small" style="color:var(--sign-ink)">ยอดประมาณการ</span><span class="amt">${baht(d * r)}</span><span class="formula">${d} วัน × ${r.toLocaleString('th-TH')} บาท/วัน</span>`;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.type === 'file' && el.files && el.files[0]) {
    if (el.dataset.doc) UI.wiz.docs[el.dataset.doc] = el.files[0].name;
    if (el.dataset.cdoc) UI.t['doc_' + el.dataset.cdoc] = el.files[0].name;
    render();
  } else if (el.dataset.w === 'repairOut' || el.dataset.w === 'repairIn') { UI.wiz.f[el.dataset.w] = el.value; render();
  } else if (el.dataset.w === 'garage') { UI.wiz.f.garage = el.value; render();
  } else if (el.tagName === 'SELECT' && el.dataset.w) { UI.wiz.f[el.dataset.w] = el.value; }
  else if (el.tagName === 'SELECT' && el.dataset.t) { UI.t[el.dataset.t] = el.value; }
});
const tipEl = () => document.getElementById('tip');
document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); const el = tipEl(); if (!t) { el.hidden = true; return; } el.textContent = t.dataset.tip; el.hidden = false; });
document.addEventListener('pointermove', e => { const el = tipEl(); if (el.hidden) return; const w = el.offsetWidth, x = Math.min(e.clientX + 12, innerWidth - w - 8); el.style.left = Math.max(8, x) + 'px'; el.style.top = (e.clientY + 16) + 'px'; });
document.addEventListener('scroll', () => { tipEl().hidden = true; }, { passive:true });
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-a]')) { e.preventDefault(); const fn = A[e.target.dataset.a]; if (fn && fn(e.target, e) !== false) { render(); const g = document.querySelector(`g[data-k="${UI.flowSel}"]`); g && g.focus(); } return; } if (e.key === 'Escape' && UI.modal) { UI.modal = null; UI.err = ''; render(); } });

render();
</script>
